name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build and test
        run: npm test

      - name: Diagnose Windows PowerShell startup after failure
        if: failure() && runner.os == 'Windows'
        timeout-minutes: 2
        run: node scripts/windows/diagnose-startup.mjs

      - name: Check Linux script syntax
        if: runner.os == 'Linux'
        run: |
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(find scripts -name '*.sh' -print0)
          bash -n packaging/linux/audit-reader
          bash -n packaging/linux/command-bridge

      - name: Check Windows installer assets
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $files = Get-ChildItem -Path scripts -Recurse -Filter *.ps1
          $allErrors = @()
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            $allErrors += $errors
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | ForEach-Object { $_.ToString() }
            exit 1
          }
          [xml](Get-Content -Raw packaging/windows/CommandBridgeMCP.xml) | Out-Null

      - name: Prepare systemd verification paths
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo groupadd --system command-bridge
          sudo useradd --system --gid command-bridge --home-dir /var/empty/command-bridge --shell /usr/sbin/nologin --no-create-home command-bridge
          sudo install -d -m 0555 /var/empty/command-bridge
          sudo install -d -m 0755 /opt/command-bridge/runtime/current/bin
          sudo install -d -m 0755 /opt/command-bridge/current/dist
          sudo install -d -m 0700 /etc/command-bridge
          sudo install -d -m 0750 -o command-bridge -g command-bridge /var/lib/command-bridge/work
          sudo ln -s "$(command -v node)" /opt/command-bridge/runtime/current/bin/node
          sudo install -m 0600 /dev/null /etc/command-bridge/command-bridge.env
          sudo install -m 0644 /dev/null /opt/command-bridge/current/dist/index.js

      - name: Verify systemd unit
        if: runner.os == 'Linux'
        run: |
          sudo systemd-analyze verify packaging/systemd/command-bridge.service
          installer_unit="$(mktemp --suffix=.service)"
          sed -e "s/__INSTALLER_UID__/$(id -u)/g" -e "s/__INSTALLER_GID__/$(id -g)/g" packaging/systemd/command-bridge-installer.service > "$installer_unit"
          sudo systemd-analyze verify "$installer_unit"
          rm -f "$installer_unit"

  publish-channel:
    needs: [test, service-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: install-channel
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - run: node scripts/publish-channel.mjs

  service-smoke:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Linux service lifecycle
        if: runner.os == 'Linux'
        run: bash scripts/linux-systemd/tests/service-smoke.sh
      - name: Linux 1.0.5 migration and rollback
        if: runner.os == 'Linux'
        run: bash scripts/linux-systemd/tests/migration-smoke.sh
      - name: Windows service lifecycle
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\windows\tests\service-smoke.ps1
